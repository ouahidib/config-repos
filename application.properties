# ----- application.properties (commun à tous les services)
# EUREKA_URL est fournie par docker-compose ; sous IntelliJ, localhost:8761
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
spring.h2.console.enabled=true
management.endpoints.web.exposure.include=health,info,refresh

# Enregistrement et affichage par adresse IP
# Pour avoir l'adresse IP une fois cliqué
eureka.instance.prefer-ip-address=true
# pour avoir aussi IP à l'affichage tableau bord eureka
eureka.instance.instance-id=${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}
